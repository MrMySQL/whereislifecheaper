name: Weekly Rent Scrape

on:
  schedule:
    # Mondays at 04:00 UTC - separate from the daily grocery scrape.
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  scrape-rent:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Install xvfb for headed browser support
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Sync exchange rates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: npm run rates:sync

      - name: Scrape rent (headed with xvfb for flatfy/DataDome)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLAYWRIGHT_HEADLESS: 'false'
          NODE_ENV: production
          DISPLAY: ':99'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npm run rent:scrape

      - name: Aggregate rent stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: npm run rent:aggregate

      # The summary lives in logs/, which is gitignored and dies with the
      # runner - keep a copy so per-source health is recoverable after the fact.
      - name: Upload rent scrape summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rent-scrape-summary
          path: logs/rent-scrape-summary.json
          if-no-files-found: warn
          retention-days: 30

      # Runs last, and only after the listings have been persisted and
      # aggregated, so a dead source reports loudly without costing us the
      # data the surviving sources did collect. `always()` because a failing
      # aggregate step must not swallow the source-health verdict - the summary
      # it reads is gone once the runner is torn down.
      - name: Check rent source health
        if: always()
        run: npm run rent:check-sources
