name: CI

# Type-checking and tests. The Vercel build deliberately does neither (see
# scripts/vercel/build.sh), so this workflow is what stops a type error from
# reaching a deploy - make it a required check on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR's runs share a group, so a new push cancels the superseded run. Each push
# to main gets its own group (its SHA): a group holds one running and one
# pending run, and a newer pending run replaces the older one even without
# cancel-in-progress, so a shared group would drop intermediate commits.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: whereislifecheaper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/whereislifecheaper
      # Integration suites create and drop their own databases on this server.
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/whereislifecheaper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile &
          (cd frontend && bun install --frozen-lockfile) &
          wait -n && wait -n

      - name: Type-check backend
        run: npx tsc --noEmit

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc -b

      - name: Backend tests
        run: npm test

      - name: Frontend tests
        run: npm run test:frontend

      # What Vercel runs: the bundles, the migrations (against the service
      # database), then loading api/index.js -> dist/vercel-api/index.js. The
      # tests above import the TypeScript sources, so a bundling problem would
      # otherwise only show up in a deploy.
      - name: Vercel build and function entry
        run: |
          bash scripts/vercel/build.sh
          node -e "const app = require('./api/index.js'); if (typeof app !== 'function') throw new Error('api/index.js does not export the Express app');"
